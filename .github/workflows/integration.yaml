name: Integration

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check Markdown
        run: bun run format:md:check
      - name: Run tests
        run: bun run test
      - name: Build site
        run: bun run docs:build
